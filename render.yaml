# Render 部署配置
# 在 Render 控制台选择 "Blueprint" 导入本文件，或手动按以下配置创建 Web Service
services:
  - type: web
    name: cat-mood-api
    runtime: node
    plan: free
    branch: main
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: AI_PROVIDER
        value: aliyun
      - key: DASHSCOPE_API_KEY
        sync: false   # 敏感值：在 Render 控制台手动填写，不写入仓库
      - key: ALIYUN_PROMPT
        value: ""
      - key: CHONGZHILING_TOKEN
        sync: false   # 敏感值：备用供应商，暂可留空
      - key: CZL_ANIMAL_TYPE
        value: "1"
